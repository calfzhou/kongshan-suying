name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jsonnet v0.22.0 (go-jsonnet) + deps
        shell: bash
        run: |
          set -euo pipefail

          JSONNET_VERSION="v0.22.0"
          curl -fsSL -o /tmp/jsonnet.tar.gz \
            "https://github.com/google/go-jsonnet/releases/download/${JSONNET_VERSION}/go-jsonnet_${JSONNET_VERSION#v}_Linux_x86_64.tar.gz"
          sudo tar -C /usr/local/bin -xzf /tmp/jsonnet.tar.gz jsonnet
          jsonnet --version

          sudo apt-get update
          sudo apt-get install -y librsvg2-bin zip

      - name: Build release package
        run: make clean cskin

      - name: Get tag description
        id: tag_desc
        shell: bash
        run: |
          set -euo pipefail
          current_tag="${GITHUB_REF_NAME}"
          tag_notes=""
          if git rev-parse -q --verify "refs/tags/${current_tag}^{tag}" >/dev/null; then
            tag_notes="$(git for-each-ref "refs/tags/${current_tag}" --format='%(contents)')"
          fi

          if printf '%s' "$tag_notes" | grep -q '[^[:space:]]'; then
            echo "Using annotated tag message as release notes."
            body="$tag_notes"
          else
            echo "Annotated tag message not found; using commit-range summary."
            previous_tag="$(git describe --tags --abbrev=0 "${current_tag}^" 2>/dev/null || true)"
            if [ -n "$previous_tag" ]; then
              range="${previous_tag}..${current_tag}"
              header="## Changes (${previous_tag} -> ${current_tag})"
            else
              range="${current_tag}"
              header="## Changes (${current_tag})"
            fi

            notes="$(git log --no-merges --pretty='- %s (%h)' ${range})"
            if [ -z "$notes" ]; then
              notes="- No commit summary available in this range."
            fi

            body="${header}\n\n${notes}"
          fi

          {
            echo 'body<<EOF'
            echo -e "$body"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.tag_desc.outputs.body }}
          files: 空山素影-calf-*.cskin
