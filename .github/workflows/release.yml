name: Build and Release

on:
  push:
    branches:
      - calf
    tags:
      - 'v*'
  pull_request:
    branches:
      - calf

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin zip fonts-noto-cjk
          fc-cache -f -v
          go install github.com/google/go-jsonnet/cmd/jsonnet@v0.21.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          jsonnet --version

      - name: Build package
        run: make clean cskin

      - name: Get tag description
        if: startsWith(github.ref, 'refs/tags/v')
        id: tag_desc
        shell: bash
        run: |
          set -euo pipefail
          current_tag="${GITHUB_REF_NAME}"
          tag_object_type="$(git cat-file -t "refs/tags/${current_tag}" 2>/dev/null || true)"
          if [ "$tag_object_type" != "tag" ]; then
            echo "::error::Tag ${current_tag} is not an annotated tag (object type: ${tag_object_type:-unknown}). Recreate it with: git tag -a ${current_tag} -m 'release notes' && git push origin ${current_tag}"
            exit 1
          fi

          tag_notes="$(git for-each-ref "refs/tags/${current_tag}" --format='%(contents)')"
          if ! printf '%s' "$tag_notes" | grep -q '[^[:space:]]'; then
            echo "::error::Annotated tag ${current_tag} has an empty message. Add release notes to the tag annotation."
            exit 1
          fi
          echo "Using annotated tag message as release notes."
          body="$tag_notes"

          {
            echo 'body<<EOF'
            echo -e "$body"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.tag_desc.outputs.body }}
          files: kongshan-suying-calf-*.cskin
